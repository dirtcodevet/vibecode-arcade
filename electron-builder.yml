# Packaging targets for the shell on all three desktops. Declared for v0.1,
# not built yet: `pnpm dist` would produce installers into release/.
appId: org.vibecodearcade.shell
productName: VibeCode Arcade
copyright: VibeCode Arcade contributors
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # Conformance fixtures, resolved relative to the resources folder when packaged.
  - from: examples/reference-cartridge
    to: examples/reference-cartridge
  - from: examples/broken-cartridge
    to: examples/broken-cartridge
asar: true
# Electron fuses, flipped by electron-builder (@electron/fuses) right before
# signing: no ELECTRON_RUN_AS_NODE, NODE_OPTIONS, or --inspect in the shipped
# app; app code only from a validated app.asar; encrypted cookie store.
# grantFileProtocolExtraPrivileges stays at its default (on) because the shell
# page loads from file:// and its module scripts need it; turning it off leaves
# the window blank until the shell moves to a custom protocol.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.games
linux:
  target:
    - AppImage
    - deb
    - tar.gz
  category: Game
  maintainer: VibeCode Arcade contributors
publish: null
