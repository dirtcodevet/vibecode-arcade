name: Catalog and rules

on:
  push:
  pull_request:

jobs:
  check:
    name: Admit arcade.json
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Validate catalog
        run: pnpm validate:catalog
      - name: Validate reference cartridge
        run: pnpm validate:catalog -- examples/reference-cartridge
