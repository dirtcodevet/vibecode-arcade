name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Admit arcade.json
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Validate catalog
        run: pnpm validate:catalog
      - name: Validate reference cartridge
        run: pnpm validate:catalog -- examples/reference-cartridge

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan git history
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  audit:
    name: npm audit (high and critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Audit root (fail on high or critical)
        run: pnpm audit --audit-level=high
      - name: Audit reveal (fail on high or critical)
        run: pnpm --dir reveal audit --audit-level=high
